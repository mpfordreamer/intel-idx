[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idx-intel-ai"
version = "2.0.0"
description = "BEI / IDX Corporate Action Real-time Intelligence & WhatsApp Automation with LangGraph & WAHA"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ternak AI / IDX-Intel Team" },
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.7",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.10",
    "playwright>=1.44.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
